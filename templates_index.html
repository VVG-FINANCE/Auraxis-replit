<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auraxis Simulador EUR/USD</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #FFF; margin:0; padding:0; }
        header { background: #1E90FF; padding: 10px; text-align:center; font-size: 1.5em; }
        .container { padding: 10px; }
        .preco { font-size: 2em; margin-bottom: 10px; }
        .delta { font-size: 1.2em; }
        .panel { background: #222; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .opportunity { margin-bottom: 5px; padding:5px; border-left:5px solid #00FF00; }
        .opportunity.venda { border-left:5px solid #FF0000; }
        button { background: #FFD700; color:#000; padding:8px; border:none; border-radius:5px; width:100%; margin-top:5px; }
    </style>
</head>
<body>
    <header>Auraxis - EUR/USD</header>
    <div class="container">
        <div class="preco" id="preco">--</div>
        <div class="delta" id="delta">--</div>

        <div class="panel" id="scalper_panel">
            <h3>Scalper</h3>
            <div id="scalper_ops"></div>
        </div>

        <div class="panel" id="day_panel">
            <h3>Day Trader</h3>
            <div id="day_ops"></div>
        </div>

        <div class="panel" id="swing_panel">
            <h3>Swing Trader</h3>
            <div id="swing_ops"></div>
        </div>

        <div class="panel" id="position_panel">
            <h3>Position Trader</h3>
            <div id="position_ops"></div>
        </div>

        <div class="panel">
            <h3>Ajustar Pips</h3>
            <input type="number" id="pips_input" placeholder="Ex: 5">
            <button onclick="ajustarPips()">Aplicar</button>
        </div>
    </div>

    <script>
        async function atualizar() {
            const precoData = await fetch('/api/preco').then(r=>r.json());
            document.getElementById('preco').innerText = "Preço: " + precoData.preco.toFixed(5);
            document.getElementById('delta').innerText = "Delta: " + precoData.delta.toFixed(5);

            const tipos = ["scalper","day","swing","position"];
            for(let tipo of tipos){
                const opsDiv = document.getElementById(tipo+"_ops");
                opsDiv.innerHTML = "";
                const ops = await fetch(`/api/oportunidades/${tipo}`).then(r=>r.json());
                for(let o of ops){
                    const div = document.createElement("div");
                    div.className = "opportunity "+(o.tipo=="Venda"?"venda":"");
                    div.innerHTML = `
                        <strong>${o.tipo}</strong> | Score: ${o.score_final} | RR: ${o.rr} <br>
                        Entrada Ext: ${o.entrada_externa} | Entrada Int: ${o.entrada_interna} <br>
                        Stop: ${o.stop} | Take: ${o.take} | Tendência: ${o.tendencia}
                    `;
                    opsDiv.appendChild(div);
                }
            }
        }

        async function ajustarPips() {
            const pips = document.getElementById("pips_input").value;
            await fetch("/api/ajustar_pips", {
                method:"POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({pips: pips})
            });
            document.getElementById("pips_input").value = "";
        }

        setInterval(atualizar, 5000);
        atualizar();
    </script>
</body>
</html>
